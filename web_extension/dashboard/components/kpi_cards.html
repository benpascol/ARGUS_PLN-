<!-- KPI INTERACTIVE FILTER CARDS (LIGHT THEME - CLICKABLE BADGE + WATERMARK DESIGN) -->
<div class="kpi-row">
    <!-- 1. TOTAL SAMPEL -->
    <div class="kpi-card all active" id="kpi-all" onclick="filterByStatus('ALL')" title="Klik untuk memfilter: Tampilkan Semua Data">
        <div class="kpi-card-inner">
            <div class="kpi-watermark">ALL</div>
            <div class="kpi-title"><i class="fas fa-layer-group"></i> Total Sampel</div>
            <div class="kpi-number" id="stat-total">0</div>
        </div>
        <div class="kpi-click-badge" title="Filter Aktif"><i class="fas fa-check"></i></div>
    </div>

    <!-- 2. SESUAI MATCH -->
    <div class="kpi-card match" id="kpi-match" onclick="filterByStatus('MATCH')" title="Klik untuk memfilter: Sesuai Match">
        <div class="kpi-card-inner">
            <div class="kpi-watermark">MATCH</div>
            <div class="kpi-title"><i class="fas fa-check-circle"></i> Sesuai Match</div>
            <div class="kpi-number" id="stat-match">0 <span class="kpi-pct-badge">(0%)</span></div>
        </div>
        <div class="kpi-click-badge" title="Klik untuk memfilter"><i class="fas fa-arrow-pointer"></i></div>
    </div>

    <!-- 3. ROLLING DIGIT -->
    <div class="kpi-card rolling" id="kpi-rolling" onclick="filterByStatus('ROLLING')" title="Klik untuk memfilter: Rolling Digit">
        <div class="kpi-card-inner">
            <div class="kpi-watermark">ROLL</div>
            <div class="kpi-title"><i class="fas fa-sync-alt"></i> Rolling Digit</div>
            <div class="kpi-number" id="stat-rolling">0 <span class="kpi-pct-badge">(0%)</span></div>
        </div>
        <div class="kpi-click-badge" title="Klik untuk memfilter"><i class="fas fa-arrow-pointer"></i></div>
    </div>

    <!-- 4. BEDA STAND -->
    <div class="kpi-card diff" id="kpi-diff" onclick="filterByStatus('DIFF')" title="Klik untuk memfilter: Beda Stand">
        <div class="kpi-card-inner">
            <div class="kpi-watermark">BEDA</div>
            <div class="kpi-title"><i class="fas fa-exclamation-triangle"></i> Beda Stand</div>
            <div class="kpi-number" id="stat-diff">0 <span class="kpi-pct-badge">(0%)</span></div>
        </div>
        <div class="kpi-click-badge" title="Klik untuk memfilter"><i class="fas fa-arrow-pointer"></i></div>
    </div>

    <!-- 5. BUKAN KWH / NIHIL -->
    <div class="kpi-card nihil" id="kpi-nihil" onclick="filterByStatus('NIHIL')" title="Klik untuk memfilter: Bukan KWH / Nihil">
        <div class="kpi-card-inner">
            <div class="kpi-watermark">NIHIL</div>
            <div class="kpi-title"><i class="fas fa-times-circle"></i> Bukan KWH / Nihil</div>
            <div class="kpi-number" id="stat-nihil">0</div>
        </div>
        <div class="kpi-click-badge" title="Klik untuk memfilter"><i class="fas fa-arrow-pointer"></i></div>
    </div>

    <!-- 6. DIKOREKSI AUDITOR -->
    <div class="kpi-card edited" id="kpi-edited" onclick="filterByStatus('EDITED')" title="Klik untuk memfilter: Dikoreksi Auditor">
        <div class="kpi-card-inner">
            <div class="kpi-watermark">EDIT</div>
            <div class="kpi-title"><i class="fas fa-user-edit"></i> Dikoreksi Auditor</div>
            <div class="kpi-number" id="stat-edited">0</div>
        </div>
        <div class="kpi-click-badge" title="Klik untuk memfilter"><i class="fas fa-arrow-pointer"></i></div>
    </div>
</div>
