<!-- KPI INTERACTIVE FILTER CARDS (LIGHT THEME) -->
<div class="kpi-row">
    <div class="kpi-card all active" id="kpi-all" onclick="filterByStatus('ALL')">
        <div class="kpi-title"><i class="fas fa-layer-group" style="color: var(--pln-blue);"></i> Total Sampel</div>
        <div class="kpi-number" id="stat-total">0</div>
    </div>
    <div class="kpi-card match" id="kpi-match" onclick="filterByStatus('MATCH')">
        <div class="kpi-title"><i class="fas fa-check-circle" style="color: #16A34A;"></i> Sesuai Match</div>
        <div class="kpi-number" style="color: #16A34A;" id="stat-match">0 <span class="kpi-pct-badge">(0%)</span></div>
    </div>
    <div class="kpi-card rolling" id="kpi-rolling" onclick="filterByStatus('ROLLING')">
        <div class="kpi-title"><i class="fas fa-sync-alt" style="color: #D97706;"></i> Rolling Digit</div>
        <div class="kpi-number" style="color: #D97706;" id="stat-rolling">0 <span class="kpi-pct-badge">(0%)</span></div>
    </div>
    <div class="kpi-card diff" id="kpi-diff" onclick="filterByStatus('DIFF')">
        <div class="kpi-title"><i class="fas fa-exclamation-triangle" style="color: var(--pln-red);"></i> Beda Stand</div>
        <div class="kpi-number" style="color: var(--pln-red);" id="stat-diff">0 <span class="kpi-pct-badge">(0%)</span></div>
    </div>
    <div class="kpi-card nihil" id="kpi-nihil" onclick="filterByStatus('NIHIL')">
        <div class="kpi-title"><i class="fas fa-times-circle" style="color: #64748B;"></i> Bukan KWH / Nihil</div>
        <div class="kpi-number" style="color: #64748B;" id="stat-nihil">0</div>
    </div>
    <div class="kpi-card edited" id="kpi-edited" onclick="filterByStatus('EDITED')">
        <div class="kpi-title"><i class="fas fa-user-edit" style="color: #9333EA;"></i> Dikoreksi Auditor</div>
        <div class="kpi-number" style="color: #9333EA;" id="stat-edited">0</div>
    </div>
</div>
