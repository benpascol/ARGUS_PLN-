<!-- TOP HEADER CORPORATE PLN -->
<header class="pln-header">
    <div class="header-brand">
        <div class="pln-logo-badge">
            <i class="fas fa-bolt"></i>
        </div>
        <div class="header-titles">
            <h1>PT PLN (PERSERO) UNIT INDUK DISTRIBUSI JAWA TIMUR</h1>
            <p>
                <span>UP3 MOJOKERTO — SISTEM AUDIT STAND KWH METER (LBKB)</span>
            </p>
        </div>
    </div>
    <div class="header-cards-row">
        <!-- KARTU MINI 1: PANDUAN / TUTORIAL -->
        <a href="/tutorial" target="_blank" rel="noopener" class="header-mini-card card-guide" title="Buka Panduan Operasional & Tutorial ARGUS V5 di tab baru">
            <div class="header-mini-inner">
                <div class="header-mini-watermark">GUIDE</div>
                <div class="header-mini-top">
                    <i class="fas fa-book-open"></i>
                    <span>PANDUAN</span>
                </div>
                <div class="header-mini-bottom">
                    <span class="header-mini-value">Buka Tutorial</span>
                </div>
            </div>
            <div class="header-mini-click-badge" title="Buka di tab baru"><i class="fas fa-arrow-up-right-from-square"></i></div>
        </a>

        <!-- KARTU MINI 2: CELENGAN FEEDBACK AI -->
        <div class="header-mini-card card-vault" id="ai-vault-badge" onclick="showVaultInfo()" title="Klik untuk membuka pengelola Celengan Feedback AI (tersimpan persisten, aman dari Refresh & Reset Tabel, otomatis dikemas ZIP pada 1.000 kasus).">
            <div class="header-mini-inner">
                <div class="header-mini-watermark">VAULT</div>
                <div class="header-mini-top">
                    <i class="fas fa-piggy-bank"></i>
                    <span>CELENGAN AI</span>
                </div>
                <div class="header-mini-bottom">
                    <span class="header-mini-value vault-mono" id="ai-vault-count-text">0 / 1000</span>
                    <span class="header-mini-sub" id="ai-vault-pct-badge">(0%)</span>
                </div>
                <div class="vault-card-bar"><div class="vault-card-bar-fill" id="ai-vault-mini-fill" style="width:0%;"></div></div>
            </div>
            <div class="header-mini-click-badge" title="Klik untuk kelola & kemas paket AI"><i class="fas fa-arrow-pointer"></i></div>
        </div>

        <!-- KARTU MINI 3: STATUS ENGINE AI -->
        <div class="header-mini-card card-engine is-static" title="Status akselerasi komputasi lokal ARGUS V5 (100% Offline)">
            <div class="header-mini-inner">
                <div class="header-mini-watermark">GPU</div>
                <div class="header-mini-top">
                    <span class="online-dot"></span>
                    <span>ENGINE AI AKTIF</span>
                </div>
                <div class="header-mini-bottom">
                    <span class="header-mini-value engine-value" id="engine-hardware-badge">ARGUS AI V5 (Memeriksa Hardware...)</span>
                </div>
            </div>
        </div>
    </div>
</header>
