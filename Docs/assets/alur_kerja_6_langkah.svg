      </text>
    </g>

    <!-- ================= LANGKAH 4 ================= -->
    <g transform="translate(32, 310)" filter="url(#cardShadow)">
      <rect width="296" height="164" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" />
      <rect width="296" height="5" rx="2.5" fill="#0d9488" />
      <rect x="18" y="18" width="84" height="22" rx="6" fill="#0d9488" />
      <text x="60" y="33" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#ffffff">LANGKAH 4</text>
      <!-- Icon Search/Inspect -->
