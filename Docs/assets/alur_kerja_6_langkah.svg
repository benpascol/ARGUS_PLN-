      <path d="M264 23 L259 28 H262 V34 H266 V28 H269 Z" fill="#0891b2" />

      <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">
