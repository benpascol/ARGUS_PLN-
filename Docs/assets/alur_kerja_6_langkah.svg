      </text>
      <rect x="18" y="132" width="260" height="22" rx="6" fill="#e0e7ff" />
      <text x="28" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#3730a3">
