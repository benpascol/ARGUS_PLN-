      </text>
    </g>

    <!-- Bottom Footer -->
    <line x1="32" y1="488" x2="1008" y2="488" stroke="#e2e8f0" stroke-width="1" />
    <text x="32" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b">
      Project ARGUS — Sistem Pengawasan Visual Otomatis LBKB UP3 Mojokerto
    </text>
    <text x="1008" y="506" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">
