      </text>
      <rect x="18" y="132" width="260" height="22" rx="6" fill="#ccfbf1" />
      <text x="28" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f766e">
        Human-in-the-Loop Zoom &amp; Pan HD
      </text>
    </g>

    <!-- ================= LANGKAH 5 ================= -->
    <g transform="translate(372, 310)" filter="url(#cardShadow)">
      <rect width="296" height="164" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
      <rect width="296" height="5" rx="2.5" fill="#7c3aed" />
      <rect x="18" y="18" width="84" height="22" rx="6" fill="#7c3aed" />
      <text x="60" y="33" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#ffffff">LANGKAH 5</text>
      <!-- Icon Database/Vault -->
      <circle cx="264" cy="29" r="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" />
      <ellipse cx="264" cy="25" rx="5" ry="2.2" fill="#7c3aed" />
      <path d="M259 25 V33 C259 34.5 269 34.5 269 33 V25" fill="none" stroke="#7c3aed" stroke-width="1.6" />

      <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">
