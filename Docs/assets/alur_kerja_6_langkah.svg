      </text>
    </g>

    <!-- ================= LANGKAH 6 ================= -->
    <g transform="translate(712, 310)" filter="url(#cardShadow)">
      <rect width="296" height="164" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <rect width="296" height="5" rx="2.5" fill="#059669" />
      <rect x="18" y="18" width="84" height="22" rx="6" fill="#059669" />
      <text x="60" y="33" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#ffffff">LANGKAH 6</text>
      <!-- Icon Check/Download -->
      <circle cx="264" cy="29" r="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5" />
      <path d="M259 29 L262.5 32.5 L270 25" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">
