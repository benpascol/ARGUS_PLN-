      <circle cx="262.5" cy="27.5" r="4" fill="none" stroke="#0d9488" stroke-width="1.8" />
      <line x1="265.5" y1="30.5" x2="269" y2="34" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" />

      <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">
        Filter &amp; Tinjau Modal HD
      </text>
      <text x="18" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#334155">
