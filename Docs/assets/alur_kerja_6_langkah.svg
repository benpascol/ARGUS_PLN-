      <text x="28" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0e7490">
        Proteksi Anti-Duplikasi (Skip/Overwrite)
      </text>
    </g>

    <!-- ================= LANGKAH 3 ================= -->
    <g transform="translate(712, 98)" filter="url(#cardShadow)">
      <rect width="296" height="164" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
      <rect width="296" height="5" rx="2.5" fill="#4f46e5" />
      <rect x="18" y="18" width="84" height="22" rx="6" fill="#4f46e5" />
      <text x="60" y="33" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#ffffff">LANGKAH 3</text>
