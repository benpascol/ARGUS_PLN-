<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="100%" height="100%">
  <defs>
    <!-- Shadows & Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="16" />
  <rect x="1" y="1" width="878" height="618" fill="none" stroke="#e2e8f0" stroke-width="2" rx="15" />

  <!-- HEADER -->
  <text x="440" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">
    ARGUS — CASCADING MULTI-TIER PIPELINE
  </text>
  <text x="440" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
    Arsitektur Verifikasi &amp; Audit Citra Kelainan LBKB KWH Meter PLN UP3 Mojokerto
  </text>

  <!-- ================= INPUT NODE ================= -->
  <g transform="translate(260, 80)">
    <rect width="360" height="52" rx="10" fill="url(#blueGrad)" filter="url(#cardShadow)" />
    <text x="180" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">📁 FOTO DOKUMENTASI LBKB</text>
    <text x="180" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0f2fe">7.470+ File JPEG (.jpg) • Resolusi 540 × 960 Piksel</text>
  </g>

  <!-- Arrow Input to Tier 1 -->
  <line x1="440" y1="132" x2="440" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= TIER 1 ================= -->
  <g transform="translate(190, 162)">
    <rect width="500" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#0284c7" />
    <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">TIER 1</text>
    <text x="82" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Filter Kualitas &amp; Deteksi Blur (OpenCV Laplacian)</text>
    <text x="82" y="46" font-family="sans-serif" font-size="11" fill="#475569">Menghitung dispersi gradien: <tspan font-family="monospace" font-weight="bold">Var(Laplacian) &lt; Threshold</tspan></text>
    <text x="82" y="62" font-family="sans-serif" font-size="10" font-weight="600" fill="#0284c7">⚡ Kecepatan: &lt; 5 ms / citra  •  Biaya: 100% Gratis &amp; Offline</text>
  </g>

  <!-- Arrow Tier 1 -> Result Blur (Branch Kanan) -->
  <path d="M 690 199 L 750 199 L 750 250" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />
  <rect x="700" y="184" width="70" height="16" rx="4" fill="#fef3c7" stroke="#fde68a" />
  <text x="735" y="196" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#b45309">BURAM / GELAP</text>

  <!-- Arrow Tier 1 -> Tier 2 (Lolos) -->
  <line x1="440" y1="236" x2="440" y2="265" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
  <rect x="448" y="242" width="68" height="16" rx="4" fill="#d1fae5" stroke="#a7f3d0" />
  <text x="482" y="254" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#065f46">LOLOS (TAJAM)</text>

  <!-- ================= TIER 2 ================= -->
  <g transform="translate(190, 268)">
    <rect width="500" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#10b981" />
    <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">TIER 2</text>
    <text x="82" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Dekoder Barcode &amp; QR Code (ZBar / PyZbar)</text>
    <text x="82" y="46" font-family="sans-serif" font-size="11" fill="#475569">Ekstraksi Nomor Seri KWH Meter Fisik (11 Digit)</text>
    <text x="82" y="62" font-family="sans-serif" font-size="10" font-weight="600" fill="#059669">🎯 Akurasi Checksum 100%  •  Instan &amp; Tanpa Halusinasi AI</text>
  </g>

  <!-- Arrow Tier 2 -> Decision Engine (Langsung jika Barcode Ditemukan) -->
  <path d="M 190 305 L 140 305 L 140 480 L 190 480" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
  <rect x="80" y="375" width="105" height="22" rx="4" fill="#e0f2fe" stroke="#bae6fd" />
  <text x="132" y="386" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0369a1">BARCODE VALID</text>
  <text x="132" y="394" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#0284c7">(Nomor 11 Digit)</text>

  <!-- Arrow Tier 2 -> Tier 3 (Jika Barcode Tidak Ada / Pagar) -->
  <line x1="440" y1="342" x2="440" y2="370" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="448" y="348" width="125" height="16" rx="4" fill="#ede9fe" stroke="#ddd6fe" />
  <text x="510" y="360" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#5b21b6">TIDAK ADA BARCODE / PAGAR</text>

  <!-- ================= TIER 3 ================= -->
  <g transform="translate(190, 373)">
    <rect width="500" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#8b5cf6" />
    <text x="42" y="26" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">TIER 3</text>
    <text x="82" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Multimodal VLM (NVIDIA NIM LLaMA 3.2 11B Vision)</text>
    <text x="82" y="46" font-family="sans-serif" font-size="11" fill="#475569">Memverifikasi Scene Lapangan (Pagar Terkunci / Pintu Rumah Tutup)</text>
    <text x="82" y="62" font-family="sans-serif" font-size="10" font-weight="600" fill="#6d28d9">🛡️ Deteksi Fraud / Objek Palsu (Aspal, Tanah, Jok Motor)  •  JSON Output</text>
  </g>

  <!-- Arrow Tier 3 -> Decision Engine -->
  <line x1="440" y1="447" x2="440" y2="475" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= TIER 4 (DECISION ENGINE) ================= -->
  <g transform="translate(190, 478)">
    <rect width="500" height="42" rx="10" fill="#1e293b" filter="url(#cardShadow)" />
    <text x="250" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">
      ⚖️ TIER 4: DETERMINISTIC DECISION ENGINE (Arbitrase Master Excel)
    </text>
  </g>

  <!-- ================= 3 OUTPUTS ================= -->
  <!-- Split Arrows to 3 Outputs -->
  <line x1="300" y1="520" x2="160" y2="548" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="440" y1="520" x2="440" y2="548" stroke="#be123c" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="580" y1="520" x2="720" y2="548" stroke="#b45309" stroke-width="2" marker-end="url(#arrowAmber)" />

  <!-- Output 1: Sesuai -->
  <g transform="translate(60, 550)">
    <rect width="210" height="54" rx="8" fill="url(#greenGrad)" filter="url(#cardShadow)" />
    <text x="105" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">1. Sesuai dengan Data</text>
    <text x="105" y="38" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#ecfdf5">• Barcode Sesuai Data PLN</text>
    <text x="105" y="48" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#ecfdf5">• Foto Pagar Valid (Kode E/F/4)</text>
  </g>

  <!-- Output 2: Tidak Sesuai -->
  <g transform="translate(335, 550)">
    <rect width="210" height="54" rx="8" fill="url(#redGrad)" filter="url(#cardShadow)" />
    <text x="105" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">2. Tidak Sesuai Data</text>
    <text x="105" y="38" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#fff1f2">• Barcode Milik Pelanggan Lain</text>
    <text x="105" y="48" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#fff1f2">• Foto Aspal / Fraud Lapangan</text>
  </g>

  <!-- Output 3: Foto Blur -->
  <g transform="translate(610, 550)">
    <rect width="210" height="54" rx="8" fill="url(#amberGrad)" filter="url(#cardShadow)" />
    <text x="105" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">3. Hasil Foto Blur</text>
    <text x="105" y="38" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#fffbeb">• Citra Rusak / Goyang Parah</text>
    <text x="105" y="48" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#fffbeb">• Gelap Total / Silau Ekstrem</text>
  </g>

  <!-- Dedicated Result Box from Tier 1 -->
  <g transform="translate(670, 253)">
    <rect width="160" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    <text x="80" y="18" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#b45309">HASIL: 3. Foto Blur</text>
    <text x="80" y="32" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#78350f">Dispersi Laplacian &lt; Cutoff</text>
  </g>
</svg>
